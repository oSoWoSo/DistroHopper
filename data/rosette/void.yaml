id: void
name: Void Linux
package_manager: xbps
init: runit
icon: void.svg
color: "#478061"

commands:
  package:
    install:  { cmd: "# xbps-install $pkg",                          desc: "Install package" }
    remove:   { cmd: "# xbps-remove -R $pkg",                        desc: "Remove package and deps" }
    purge:    { cmd: "# xbps-remove -R $pkg && xbps-remove -Oo",     desc: "Remove package, deps, orphans" }
    search:   { cmd: "$ xbps-query -Rs $pkg",                        desc: "Search packages" }
    update:   { cmd: "# xbps-install -Su",                            desc: "Upgrade all packages" }
    list:     { cmd: "$ xbps-query -l",                               desc: "List installed packages" }
    files:    { cmd: "$ xbps-query -Rf $pkg",                        desc: "List package files" }
    cache:    { cmd: "# xbps-install -S",                             desc: "Sync package cache" }
  service:
    start:    { cmd: "# sv start $svc",                      desc: "Start service" }
    stop:     { cmd: "# sv stop $svc",                       desc: "Stop service" }
    enable:   { cmd: "# ln -s /etc/sv/$svc /var/service/",   desc: "Enable service" }
    disable:  { cmd: "# rm /var/service/$svc",               desc: "Disable service" }
    status:   { cmd: "$ sv status $svc",                     desc: "Show service status" }
    list:     { cmd: "$ ls /var/service/",                    desc: "List active services" }
  network:
    show_ip:  { cmd: "$ ip addr",              desc: "Show IP addresses" }
    ping:     { cmd: "$ ping $host",          desc: "Ping host" }
    ports:    { cmd: "$ ss -tulpn",            desc: "Show open ports" }
    routes:   { cmd: "$ ip route",             desc: "Show routing table" }
    dns:      { cmd: "$ cat /etc/resolv.conf", desc: "Show DNS config" }
  files:
    list:     { cmd: "$ ls -la",             desc: "List files with details" }
    find:     { cmd: "$ find . -name $f",   desc: "Find file by name" }
    disk:     { cmd: "$ df -h",              desc: "Show disk usage" }
    du:       { cmd: "$ du -sh $dir",       desc: "Show directory size" }
    copy:     { cmd: "$ cp -r $src $dst",  desc: "Copy files/dirs" }
  users:
    add:      { cmd: "# useradd $user",     desc: "Add user" }
    passwd:   { cmd: "# passwd $user",      desc: "Set password" }
    groups:   { cmd: "$ groups $user",      desc: "Show user groups" }
    whoami:   { cmd: "$ whoami",             desc: "Show current user" }
    sudo:     { cmd: "$ sudo $cmd",         desc: "Run as root" }
  processes:
    list:     { cmd: "$ ps aux",             desc: "List all processes" }
    kill:     { cmd: "$ kill $pid",         desc: "Kill by PID" }
    top:      { cmd: "$ htop",               desc: "Interactive process monitor" }
    pgrep:    { cmd: "$ pgrep $name",       desc: "Find PID by name" }
    jobs:     { cmd: "$ jobs",               desc: "List background jobs" }
